name: Guarded draft release

on:
  repository_dispatch:
    types:
      - release-candidate

permissions: {}

concurrency:
  group: guarded-draft-release
  cancel-in-progress: false

env:
  SKILL_PATH: skills/make-bilingual-study-pdf

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_sha: ${{ steps.metadata.outputs.candidate_sha }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}

    steps:
      - name: Bind request to the current default-branch head
        env:
          CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
          CONFIRM: ${{ github.event.client_payload.confirm }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be a full lowercase 40-character Git SHA" >&2
            exit 1
          fi
          if [[ "$CONFIRM" != "CREATE_DRAFT_RELEASE" ]]; then
            echo "confirmation phrase mismatch" >&2
            exit 1
          fi
          if [[ "$EVENT_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "repository_dispatch is not bound to the default branch" >&2
            exit 1
          fi
          if [[ "$CANDIDATE_SHA" != "$EVENT_SHA" ]]; then
            echo "candidate_sha is not the repository_dispatch default-branch SHA" >&2
            exit 1
          fi
          REMOTE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')
          if [[ "$REMOTE_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "candidate_sha is not the current remote default-branch head" >&2
            exit 1
          fi

      - name: Check out the bound candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out pinned OpenAI Skill validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/skills
          ref: 49f948faa9258a0c61caceaf225e179651397431
          path: .ci/openai-skill-creator
          sparse-checkout: skills/.system/skill-creator
          persist-credentials: false

      - name: Check out pinned OpenAI Skill installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/skills
          ref: 1131cea7b17214e5a96300a5a72c94642346ef34
          path: .ci/openai-skill-installer
          sparse-checkout: skills/.system/skill-installer
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            skills/make-bilingual-study-pdf/requirements.txt

      - name: Install Skill validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate version, tag, and exact payload metadata
        id: metadata
        env:
          CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
          REQUESTED_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < "$SKILL_PATH/VERSION")
          if [[ "$REQUESTED_VERSION" != "$VERSION" ]]; then
            echo "requested version does not equal VERSION" >&2
            exit 1
          fi
          TAG="v$VERSION"
          python tools/check_skill_eol.py
          python tools/build_release_manifest.py --check
          python "$SKILL_PATH/scripts/release_check.py" --expected-version "$VERSION" --tag "$TAG"
          python tools/repository_release_check.py
          python tools/validate_skill.py "$SKILL_PATH" \
            --upstream-validator .ci/openai-skill-creator/skills/.system/skill-creator/scripts/quick_validate.py
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful main Baseline for the exact SHA
        env:
          CANDIDATE_SHA: ${{ steps.metadata.outputs.candidate_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_COUNT=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/baseline.yml/runs" \
            -f branch="$DEFAULT_BRANCH" \
            -f event=push \
            -f status=success \
            -f head_sha="$CANDIDATE_SHA" \
            -f per_page=1 \
            --jq '.total_count')
          if [[ "$RUN_COUNT" -lt 1 ]]; then
            echo "no successful Baseline push run exists for the exact candidate SHA" >&2
            exit 1
          fi

      - name: Require unused tag and Release names
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_COUNT=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq "[.[] | select(.ref == \"refs/tags/$TAG\")] | length")
          RELEASE_COUNT=$(gh release list --repo "$GITHUB_REPOSITORY" \
            --limit 1000 --json tagName \
            --jq "[.[] | select(.tagName == \"$TAG\")] | length")
          if [[ "$TAG_COUNT" -ne 0 ]]; then
            echo "tag already exists: $TAG" >&2
            exit 1
          fi
          if [[ "$RELEASE_COUNT" -ne 0 ]]; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Install and verify both release paths
        env:
          CANDIDATE_SHA: ${{ steps.metadata.outputs.candidate_sha }}
          DOWNLOAD_DEST: ${{ runner.temp }}/release-download
          GIT_DEST: ${{ runner.temp }}/release-git
          CLEAN_VENV: ${{ runner.temp }}/release-clean-venv
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
          EXPECTED_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          INSTALLER=.ci/openai-skill-installer/skills/.system/skill-installer/scripts/install-skill-from-github.py
          python "$INSTALLER" --repo "$GITHUB_REPOSITORY" --path "$SKILL_PATH" --ref "$CANDIDATE_SHA" --method download --dest "$DOWNLOAD_DEST"
          python "$INSTALLER" --repo "$GITHUB_REPOSITORY" --path "$SKILL_PATH" --ref "$CANDIDATE_SHA" --method git --dest "$GIT_DEST"
          DOWNLOAD_SKILL="$DOWNLOAD_DEST/make-bilingual-study-pdf"
          GIT_SKILL="$GIT_DEST/make-bilingual-study-pdf"
          python "$DOWNLOAD_SKILL/scripts/release_check.py" --expected-version "$EXPECTED_VERSION" --tag "$EXPECTED_TAG"
          python "$GIT_SKILL/scripts/release_check.py" --expected-version "$EXPECTED_VERSION" --tag "$EXPECTED_TAG"
          python tests/compare_install_trees.py "$SKILL_PATH" "$DOWNLOAD_SKILL"
          python tests/compare_install_trees.py "$DOWNLOAD_SKILL" "$GIT_SKILL"
          python -m venv "$CLEAN_VENV"
          "$CLEAN_VENV/bin/python" -m pip install --disable-pip-version-check -r "$DOWNLOAD_SKILL/requirements.txt"
          "$CLEAN_VENV/bin/python" -m pip check
          "$CLEAN_VENV/bin/python" "$DOWNLOAD_SKILL/scripts/self_test.py"
          "$CLEAN_VENV/bin/python" "$DOWNLOAD_SKILL/scripts/pipeline.py" validate-profile assignment-en-zh
          "$CLEAN_VENV/bin/python" "$DOWNLOAD_SKILL/scripts/pipeline.py" validate-profile academic-paper-en-zh
          "$CLEAN_VENV/bin/python" "$DOWNLOAD_SKILL/scripts/pipeline.py" validate-profile lecture-notes-en-zh

      - name: Recheck remote state after validation
        env:
          CANDIDATE_SHA: ${{ steps.metadata.outputs.candidate_sha }}
          TAG: ${{ steps.metadata.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REMOTE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')
          if [[ "$REMOTE_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "default branch advanced during release validation" >&2
            exit 1
          fi
          TAG_COUNT=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq "[.[] | select(.ref == \"refs/tags/$TAG\")] | length")
          RELEASE_COUNT=$(gh release list --repo "$GITHUB_REPOSITORY" \
            --limit 1000 --json tagName \
            --jq "[.[] | select(.tagName == \"$TAG\")] | length")
          if [[ "$TAG_COUNT" -ne 0 ]]; then
            echo "tag appeared during validation: $TAG" >&2
            exit 1
          fi
          if [[ "$RELEASE_COUNT" -ne 0 ]]; then
            echo "Release appeared during validation: $TAG" >&2
            exit 1
          fi

  create-draft-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: validate
    permissions:
      contents: write

    steps:
      - name: Atomically reserve the exact tag and create a Draft Release
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          TAG: ${{ needs.validate.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_RESERVED=false
          RELEASE_ATTEMPTED=false
          RELEASE_MARKER="guarded-draft-release:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          RELEASE_COMMENT="<!-- $RELEASE_MARKER -->"

          report_failed_creation() {
            local exit_code=$?
            trap - EXIT
            if [[ "$exit_code" -eq 0 ]]; then
              return
            fi

            if ! OBSERVED_TAG_SHA=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
              --jq "[.[] | select(.ref == \"refs/tags/$TAG\") | .object.sha][0] // \"absent\"" \
              2>/dev/null); then
              OBSERVED_TAG_SHA=unavailable
            fi
            TAG_MATCHES_CANDIDATE=false
            if [[ "$OBSERVED_TAG_SHA" == "$CANDIDATE_SHA" ]]; then
              TAG_MATCHES_CANDIDATE=true
            fi

            RELEASE_ID=not-observed
            RELEASE_IS_DRAFT=unknown
            RELEASE_IS_PRERELEASE=unknown
            RELEASE_TAG=not-observed
            RELEASE_MARKER_OWNED_BY_RUN=unknown
            if RELEASE_INFO=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json body,databaseId,isDraft,isPrerelease,tagName \
              --jq "[.databaseId, .isDraft, .isPrerelease, .tagName, (.body | contains(\"$RELEASE_MARKER\"))] | @tsv" \
              2>/dev/null); then
              IFS=$'\t' read -r RELEASE_ID RELEASE_IS_DRAFT RELEASE_IS_PRERELEASE RELEASE_TAG RELEASE_MARKER_OWNED_BY_RUN <<< "$RELEASE_INFO"
            fi

            echo "Draft release creation failed; manual inspection is required." >&2
            printf '%s\n' \
              "TAG_RESERVED_BY_RUN=$TAG_RESERVED" \
              "RELEASE_ATTEMPTED_BY_RUN=$RELEASE_ATTEMPTED" \
              "OBSERVED_TAG_SHA=$OBSERVED_TAG_SHA" \
              "TAG_MATCHES_CANDIDATE=$TAG_MATCHES_CANDIDATE" \
              "RELEASE_ID=$RELEASE_ID" \
              "RELEASE_IS_DRAFT=$RELEASE_IS_DRAFT" \
              "RELEASE_IS_PRERELEASE=$RELEASE_IS_PRERELEASE" \
              "RELEASE_TAG=$RELEASE_TAG" \
              "RELEASE_MARKER_OWNED_BY_RUN=$RELEASE_MARKER_OWNED_BY_RUN" >&2
            exit "$exit_code"
          }
          trap report_failed_creation EXIT

          REMOTE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')
          if [[ "$REMOTE_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "default branch advanced before tag creation" >&2
            exit 1
          fi
          TAG_COUNT=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq "[.[] | select(.ref == \"refs/tags/$TAG\")] | length")
          RELEASE_COUNT=$(gh release list --repo "$GITHUB_REPOSITORY" \
            --limit 1000 --json tagName \
            --jq "[.[] | select(.tagName == \"$TAG\")] | length")
          if [[ "$TAG_COUNT" -ne 0 ]]; then
            echo "tag already exists: $TAG" >&2
            exit 1
          fi
          if [[ "$RELEASE_COUNT" -ne 0 ]]; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi

          CREATED_TAG_SHA=$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$CANDIDATE_SHA" \
            --jq '.object.sha')
          TAG_RESERVED=true
          if [[ "$CREATED_TAG_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "atomic tag reservation did not return the candidate SHA" >&2
            exit 1
          fi

          # --verify-tag prevents this command from creating or retargeting a tag.
          RELEASE_ATTEMPTED=true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "$TAG" --generate-notes \
            --notes "$RELEASE_COMMENT"
          FINAL_TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          RELEASE_STATE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json body,isDraft,isPrerelease,tagName \
            --jq "[.isDraft, .isPrerelease, .tagName, (.body | contains(\"$RELEASE_MARKER\"))] | @tsv")
          if [[ "$FINAL_TAG_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "post-create tag verification failed" >&2
            exit 1
          fi
          if [[ "$RELEASE_STATE" != $'true\tfalse\t'"$TAG"$'\ttrue' ]]; then
            echo "post-create tag or Draft Release verification failed" >&2
            exit 1
          fi
          trap - EXIT
