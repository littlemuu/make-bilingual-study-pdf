name: Baseline

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SKILL_PATH: skills/make-bilingual-study-pdf

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install workflow contract dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/actionlint.tar.gz"
          BIN_DIR="$RUNNER_TEMP/actionlint-bin"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$ARCHIVE"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$ARCHIVE" | sha256sum --check
          mkdir -p "$BIN_DIR"
          tar -xzf "$ARCHIVE" -C "$BIN_DIR"
          "$BIN_DIR/actionlint" -color

      - name: Run workflow contract checks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/run_test_suite.py workflow-contracts

  self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned OpenAI Skill validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/skills
          ref: 49f948faa9258a0c61caceaf225e179651397431
          path: .ci/openai-skill-creator
          sparse-checkout: skills/.system/skill-creator
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            skills/make-bilingual-study-pdf/requirements.txt

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pandoc poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip check

      - name: Record toolchain
        run: |
          python --version
          python -m pip freeze
          pdftoppm -v

      - name: Run event-tier test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          SUITE="${{ github.event_name == 'pull_request' && 'pr-fast' || 'full' }}"
          python tools/run_test_suite.py "$SUITE" \
            --upstream-validator .ci/openai-skill-creator/skills/.system/skill-creator/scripts/quick_validate.py

  windows-filesystem:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip check

      - name: Install pinned Poppler for native source smoke
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'poppler.zip'
          Invoke-WebRequest 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.07.0-0/Release-26.07.0-0.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a711b0563b06edc488583d28198b6734c5a494afbbd1b9d87d3d2866062fb7e2') {
            throw 'Poppler archive hash mismatch'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'native-source-poppler'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          (Join-Path $destination 'poppler-26.07.0/Library/bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run clean payload native source smoke on Windows
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/v23_ir_source_test.py

      - name: Run full Windows filesystem regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/run_test_suite.py windows-full

  installer-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: self-test
    env:
      INSTALL_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
      INSTALL_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out pinned OpenAI skill installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/skills
          ref: 1131cea7b17214e5a96300a5a72c94642346ef34
          path: .ci/openai-skills
          sparse-checkout: skills/.system/skill-installer
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: skills/make-bilingual-study-pdf/requirements.txt

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Install through the default real installer path
        env:
          WORKFLOW_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTO_DEST="$RUNNER_TEMP/skill-auto"
          AUTO_GIT_TRACE="$RUNNER_TEMP/skill-auto-git-trace.json"
          INSTALLER=.ci/openai-skills/skills/.system/skill-installer/scripts/install-skill-from-github.py
          if [[ "$INSTALL_REPO" == "$GITHUB_REPOSITORY" ]]; then
            export GITHUB_TOKEN="$WORKFLOW_GITHUB_TOKEN"
          else
            unset GITHUB_TOKEN GH_TOKEN WORKFLOW_GITHUB_TOKEN
          fi
          GIT_TRACE2_EVENT="$AUTO_GIT_TRACE" \
            python "$INSTALLER" --repo "$INSTALL_REPO" --path "$SKILL_PATH" --ref "$INSTALL_SHA" --dest "$AUTO_DEST"
          if [[ -e "$AUTO_GIT_TRACE" ]]; then
            echo "default auto installation unexpectedly produced a Git trace" >&2
            exit 1
          fi

      - name: Verify exact installed payload and clean environment
        run: |
          AUTO_DEST="$RUNNER_TEMP/skill-auto"
          AUTO_SKILL="$AUTO_DEST/make-bilingual-study-pdf"
          python "$AUTO_SKILL/scripts/release_check.py"
          python tests/compare_install_trees.py "$SKILL_PATH" "$AUTO_SKILL"
          CLEAN_VENV="$RUNNER_TEMP/skill-clean-venv"
          python -m venv "$CLEAN_VENV"
          "$CLEAN_VENV/bin/python" -m pip install --disable-pip-version-check -r "$AUTO_SKILL/requirements.txt"
          "$CLEAN_VENV/bin/python" -m pip check
          "$CLEAN_VENV/bin/python" "$AUTO_SKILL/scripts/self_test.py"
          "$CLEAN_VENV/bin/python" "$AUTO_SKILL/scripts/pipeline.py" validate-profile assignment-en-zh
          "$CLEAN_VENV/bin/python" "$AUTO_SKILL/scripts/pipeline.py" validate-profile academic-paper-en-zh
          "$CLEAN_VENV/bin/python" "$AUTO_SKILL/scripts/pipeline.py" validate-profile lecture-notes-en-zh

  automated-forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: self-test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            skills/make-bilingual-study-pdf/requirements.txt

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fontconfig \
            fonts-dejavu-core \
            fonts-noto-cjk \
            fonts-noto-core \
            libreoffice-writer \
            pandoc \
            poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip check

      - name: Record document toolchain
        run: |
          python --version
          pandoc --version | head -n 1
          libreoffice --version
          pdftoppm -v
          fc-match --version
          fc-match --format '%{family}\n%{file}\n' 'Noto Sans CJK SC'

      - name: Run both V2.3 automated forward chains
        run: python tests/v23_e2e_test.py artifacts/v23-e2e

      - name: Upload forward-test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v23-automated-forward
          path: artifacts/v23-e2e
          if-no-files-found: warn

  pr-fast:
    name: pr-fast
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs:
      - workflow-lint
      - self-test
      - installer-parity
      - automated-forward

    steps:
      - name: Check out exact aggregate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require every pr-fast evidence job to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python tools/check_job_results.py --require \
            workflow-lint \
            self-test \
            installer-parity \
            automated-forward

  main-full:
    name: main-full
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs:
      - workflow-lint
      - self-test
      - windows-filesystem
      - installer-parity
      - automated-forward

    steps:
      - name: Check out exact aggregate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require every main-full evidence job to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python tools/check_job_results.py --require \
            workflow-lint \
            self-test \
            windows-filesystem \
            installer-parity \
            automated-forward
