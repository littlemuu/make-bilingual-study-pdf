name: Baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip check

      - name: Record toolchain
        run: |
          python --version
          python -m pip freeze
          pdftoppm -v

      - name: Run deterministic baseline
        run: |
          python scripts/self_test.py
          python scripts/v23_profile_test.py
          python scripts/v23_mineru_test.py
          python scripts/v23_ir_source_test.py
          python scripts/v23_output_test.py
          python scripts/v23_docx_test.py
          python scripts/v23_visual_gate_test.py
          python scripts/pipeline.py validate-profile assignment-en-zh
          python scripts/pipeline.py validate-profile academic-paper-en-zh
          python scripts/pipeline.py validate-profile lecture-notes-en-zh

  automated-forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: self-test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fontconfig \
            fonts-dejavu-core \
            fonts-noto-cjk \
            fonts-noto-core \
            libreoffice-writer \
            pandoc \
            poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip check

      - name: Record document toolchain
        run: |
          python --version
          pandoc --version | head -n 1
          libreoffice --version
          pdftoppm -v
          fc-match --version
          fc-match --format '%{family}\n%{file}\n' 'Noto Sans CJK SC'

      - name: Run both V2.3 automated forward chains
        run: python scripts/v23_e2e_test.py artifacts/v23-e2e

      - name: Upload forward-test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v23-automated-forward
          path: artifacts/v23-e2e
          if-no-files-found: warn
